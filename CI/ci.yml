name: Development Branch CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Tests
        run: |
          pytest || if [ $? -eq 5 ]; then
            echo "No tests found - treating as success"
            exit 0
          else
            exit $?
          fi

  merge-and-deploy:
    name: Merge and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Merge dev into main
        run: |
          git fetch origin
          git checkout main
          git pull origin main
          git merge --no-ff origin/dev -m "Merge dev into main"
          git push origin main

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.name of ssh key from repo setting and don't forget to copy ssh key from local pc to this repo }}

      - name: Deploy to Remote Server
        run: |
          ssh -o StrictHostKeyChecking=no user@XX.XX.XXX.XXX << 'EOF'
            cd /mnt/sdb/sudip/ci_deployment/samsung-main
            git fetch origin main
            git reset --hard origin/main
            
            # Activate virtual environment if you're using one
            source venv/bin/activate
            
            # Install any new dependencies
            pip install -r requirements.txt
            
            # Restart your FastAPI application
            sudo systemctl restart your_fastapi_service
            
            echo "Deployment successful!"
          EOF
