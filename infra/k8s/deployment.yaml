# deployment.yaml
# Sample Kubernetes Deployment manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-app
  template:
    metadata:
      labels:
        app: mlops-app
    spec:
      containers:
      - name: mlops-app
        image: mlops-app:latest
        ports:
        - containerPort: 8000
